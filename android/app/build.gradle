import java.util.Properties

apply plugin: 'com.android.application'

def loadHaciendaSigningProperties() {
    def props = new Properties()
    def signingEnv = System.getenv("HACIENDA_SIGNING_ENV")
    def defaultFile = new File(System.getProperty("user.home"), ".hacienda-secrets/hacienda-signing.env")
    def signingFile = signingEnv ? new File(signingEnv) : defaultFile

    if (signingFile.exists()) {
        signingFile.withInputStream { props.load(it) }
    }

    [
        "HACIENDA_UPLOAD_STORE_FILE",
        "HACIENDA_UPLOAD_STORE_PASSWORD",
        "HACIENDA_UPLOAD_KEY_ALIAS",
        "HACIENDA_UPLOAD_KEY_PASSWORD"
    ].each { key ->
        def value = System.getenv(key)
        if (value != null && value.trim()) {
            props.setProperty(key, value)
        }
    }

    return props
}

def haciendaSigning = loadHaciendaSigningProperties()
def haciendaReleaseSigningReady =
    haciendaSigning.getProperty("HACIENDA_UPLOAD_STORE_FILE") &&
    haciendaSigning.getProperty("HACIENDA_UPLOAD_STORE_PASSWORD") &&
    haciendaSigning.getProperty("HACIENDA_UPLOAD_KEY_ALIAS") &&
    haciendaSigning.getProperty("HACIENDA_UPLOAD_KEY_PASSWORD")

android {
    namespace = "com.haciendadeletras.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.haciendadeletras.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.0.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (haciendaReleaseSigningReady) {
                storeFile file(haciendaSigning.getProperty("HACIENDA_UPLOAD_STORE_FILE"))
                storePassword haciendaSigning.getProperty("HACIENDA_UPLOAD_STORE_PASSWORD")
                keyAlias haciendaSigning.getProperty("HACIENDA_UPLOAD_KEY_ALIAS")
                keyPassword haciendaSigning.getProperty("HACIENDA_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (haciendaReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == "bundleRelease" && !haciendaReleaseSigningReady) {
        task.doFirst {
            throw new GradleException("Release signing is not configured. Provide Hacienda upload signing properties outside the repository.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
